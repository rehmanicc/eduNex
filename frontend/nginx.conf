server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets. Vite's JavaScript/CSS bundles benefit significantly
    # on first load while images/fonts are already compressed formats.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Vite uses content hashes in production asset filenames. They can therefore
    # be cached for a year safely; a changed deployment produces a new filename.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Never let an old SPA shell pin users to a previous deployment.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
